<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>絵を生き物に</title>
  <!-- MediaPipe Hands & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: #111;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      display: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* 右上のプラスボタン */
    #add-image-btn {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b6b, #ff8e53);
      color: white;
      font-size: 38px;
      font-weight: bold;
      border: 3px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    #add-image-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
    }
    #add-image-btn:active {
      transform: scale(0.95);
    }
    /* 非表示のファイル選択インプット */
    #image-file-input {
      display: none;
    }
    /* 右下のゴミ箱 */
    #trash-bin {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(30, 30, 35, 0.75);
      backdrop-filter: blur(6px);
      color: white;
      font-size: 36px;
      border: 3px dashed rgba(255, 255, 255, 0.5);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      pointer-events: none;
    }
    #trash-bin.active {
      transform: scale(1.22);
      background: rgba(230, 57, 70, 0.9);
      border: 3px solid #ffffff;
      box-shadow: 0 0 25px rgba(230, 57, 70, 0.8);
    }
    /* ステータスガイド表示 */
    #hud {
      position: fixed;
      top: 24px;
      left: 24px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      color: #fff;
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 100;
      pointer-events: none;
      line-height: 1.6;
      font-size: 14px;
    }
    #hud strong {
      font-size: 16px;
      color: #ffd166;
    }
    #loading {
      position: fixed;
      inset: 0;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      font-size: 20px;
      gap: 12px;
    }
  </style>
</head>
<body>

<div id="loading">
  <div>カメラとAIモデルを起動中...</div>
  <div style="font-size: 14px; color: #aaa;">カメラの使用を許可してください</div>
</div>

<div id="container">
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div>状態: <strong id="gesture-status">手をかざしてください</strong></div>
    <div>☝️ <b>人差し指を立てて1秒静止</b>：白い線で絵を描く</div>
    <div>✋ <b>手をパーにする</b>：描いた絵が生き物になる</div>
    <div>🤏 <b>親指と人差し指でつまむ</b>：生き物を掴む（右下のゴミ箱で削除）</div>
    <div>➕ <b>右上の＋ボタン</b>：端末内の画像を選んで生き物にする</div>
  </div>
  <input type="file" id="image-file-input" accept="image/*" multiple>
  <button id="add-image-btn" title="デバイス内の画像を選んで生き物にする">＋</button>
  <div id="trash-bin" title="ここに生き物を運ぶと消えます">🗑️</div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('gesture-status');
const addImageBtn = document.getElementById('add-image-btn');
const imageFileInput = document.getElementById('image-file-input');
const trashBin = document.getElementById('trash-bin');
const loadingEl = document.getElementById('loading');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});

// 描画中のストロークと全ストローク
let allStrokes = [];
let currentStroke = null;

// 1秒静止して描画開始するためのタイマー・座標管理
let isDrawingActive = false;
let pointHoldStartTime = null;
let pointAnchorPos = null;
const HOLD_DURATION_MS = 1000; // 1秒
const STILL_THRESHOLD_PX = 25; // 静止とみなす許容範囲(px)

// 生まれた生き物のリスト
let creatures = [];

// 掴み状態管理
let grabbedCreature = null;
let grabOffset = { x: 0, y: 0 };
let lastPinchPos = { x: 0, y: 0 };

// 最新の手のランドマーク情報
let latestHandData = null;

// 2点間の距離
function dist(p1, p2) {
  return Math.hypot(p1.x - p2.x, p1.y - p2.y);
}

// 指が伸びているか判定（手首からの距離を比較）
function isFingerExtended(lm, tipIdx, pipIdx) {
  const wrist = lm[0];
  return dist(lm[tipIdx], wrist) > dist(lm[pipIdx], wrist) * 1.15;
}

// ジェスチャー判定
function detectGesture(lm) {
  const indexExt = isFingerExtended(lm, 8, 6);
  const middleExt = isFingerExtended(lm, 12, 10);
  const ringExt = isFingerExtended(lm, 16, 14);
  const pinkyExt = isFingerExtended(lm, 20, 18);

  // 親指と人差し指の距離（ピンチ判定）
  const pinchDist = dist(lm[4], lm[8]);

  // ピンチ（掴む）: 親指と人差し指の先が近い
  if (pinchDist < 0.055) {
    return 'PINCH';
  }

  // 人差し指だけ立てている（描画）
  if (indexExt && !middleExt && !ringExt && !pinkyExt) {
    return 'POINT';
  }

  // パー（4本以上の指が伸びている）
  if (indexExt && middleExt && ringExt && pinkyExt) {
    return 'OPEN';
  }

  return 'OTHER';
}

// 生き物クラス（描いた線 または デバイスから選択した画像）
class Creature {
  constructor(options) {
    this.type = options.type; // 'drawing' or 'image'
    this.x = options.x;
    this.y = options.y;
    this.vx = (Math.random() - 0.5) * 4;
    this.vy = -2;
    this.radius = options.radius || 55;

    // 描画タイプ用
    this.strokes = options.strokes || [];

    // 画像タイプ用
    this.image = options.image || null;
    this.drawW = options.drawW || this.radius * 2;
    this.drawH = options.drawH || this.radius * 2;

    // アニメーション用パラメータ
    this.phase = Math.random() * Math.PI * 2;
    this.squashX = 1;
    this.squashY = 1;
    this.isGrabbed = false;
    this.nextActionTime = performance.now() + 1000 + Math.random() * 2000;
  }

  update(now) {
    if (this.isGrabbed) {
      this.squashX = 1.12;
      this.squashY = 0.88;
      return;
    }

    // 重力
    const gravity = 0.45;
    this.vy += gravity;

    this.x += this.vx;
    this.y += this.vy;

    // 地面との衝突（バウンド＆ランダム行動）
    const floorY = height - this.radius - 10;
    if (this.y >= floorY) {
      this.y = floorY;
      this.vy = 0;
      this.vx *= 0.88; // 摩擦

      // ランダム行動（ジャンプはたまにだけ、普段はトコトコ移動や休憩）
      if (now > this.nextActionTime) {
        const action = Math.random();
        if (action < 0.18) {
          // たまにジャンプ！（約18%の確率）
          this.vy = -(Math.random() * 9 + 7);
          this.vx = (Math.random() - 0.5) * 9;
          this.squashX = 0.78;
          this.squashY = 1.25;
        } else if (action < 0.75) {
          // 横にトコトコ歩く
          this.vx = (Math.random() - 0.5) * 7;
        } else {
          // その場でじっとする
          this.vx = 0;
        }
        this.nextActionTime = now + 1200 + Math.random() * 2500;
      }
    }

    // 壁との反射
    if (this.x < this.radius) {
      this.x = this.radius;
      this.vx = Math.abs(this.vx) * 0.8;
    } else if (this.x > width - this.radius) {
      this.x = width - this.radius;
      this.vx = -Math.abs(this.vx) * 0.8;
    }

    // 天井との反射
    if (this.y < this.radius) {
      this.y = this.radius;
      this.vy = Math.abs(this.vy) * 0.5;
    }

    // ぷにぷに伸縮の復元
    this.phase += 0.12;
    const idleWobble = Math.sin(this.phase) * 0.035;
    this.squashX += (1 + idleWobble - this.squashX) * 0.15;
    this.squashY += (1 - idleWobble - this.squashY) * 0.15;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.squashX, this.squashY);

    if (this.type === 'drawing') {
      // 白い線を描画
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(120, 220, 255, 0.8)';
      ctx.shadowBlur = 12;

      for (const stroke of this.strokes) {
        if (stroke.length < 2) continue;
        ctx.beginPath();
        ctx.moveTo(stroke[0].x, stroke[0].y);
        for (let i = 1; i < stroke.length; i++) {
          ctx.lineTo(stroke[i].x, stroke[i].y);
        }
        ctx.stroke();
      }
      ctx.shadowBlur = 0;

    } else if (this.type === 'image' && this.image) {
      // 選択した画像を描画（アスペクト比を維持・透過PNGもそのまま綺麗に描画）
      ctx.drawImage(
        this.image,
        -this.drawW / 2,
        -this.drawH / 2,
        this.drawW,
        this.drawH
      );

      // 足（ぴょこぴょこ動く小さな足）
      const footSwing = Math.sin(this.phase * 1.5) * 6;
      const footY = this.drawH / 2 - 2;
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.ellipse(-20, footY + footSwing, 13, 8, 0, 0, Math.PI * 2);
      ctx.ellipse(20, footY - footSwing, 13, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  contains(px, py) {
    return Math.hypot(px - this.x, py - this.y) <= this.radius + 25;
  }
}

// 描かれた線を生き物に変換する
function convertDrawingToCreature() {
  if (currentStroke && currentStroke.length > 0) {
    allStrokes.push(currentStroke);
    currentStroke = null;
  }
  if (allStrokes.length === 0) return;

  // 全点のバウンディングボックスを計算
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  let pointCount = 0;

  for (const stroke of allStrokes) {
    for (const pt of stroke) {
      if (pt.x < minX) minX = pt.x;
      if (pt.y < minY) minY = pt.y;
      if (pt.x > maxX) maxX = pt.x;
      if (pt.y > maxY) maxY = pt.y;
      pointCount++;
    }
  }

  if (pointCount < 5) {
    allStrokes = [];
    return;
  }

  const centerX = (minX + maxX) / 2;
  const centerY = (minY + maxY) / 2;
  const radius = Math.max((maxX - minX) / 2, (maxY - minY) / 2, 35);

  // 中心からの相対座標に変換
  const relativeStrokes = allStrokes.map(stroke =>
    stroke.map(pt => ({
      x: pt.x - centerX,
      y: pt.y - centerY
    }))
  );

  creatures.push(new Creature({
    type: 'drawing',
    x: centerX,
    y: centerY,
    radius: radius,
    strokes: relativeStrokes
  }));

  allStrokes = [];
}

// プラスボタン：デバイス内の画像選択ダイアログを開く
addImageBtn.addEventListener('click', () => {
  imageFileInput.click();
});

// 画像ファイルが選択されたら読み込んで生き物にする
imageFileInput.addEventListener('change', (e) => {
  const files = e.target.files;
  if (!files || files.length === 0) return;

  Array.from(files).forEach((file) => {
    if (!file.type.startsWith('image/')) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        // 最大サイズを140pxに収めつつ元の縦横比を維持
        const maxSize = 140;
        let drawW = img.width;
        let drawH = img.height;
        if (drawW > drawH) {
          if (drawW > maxSize) {
            drawH = (drawH * maxSize) / drawW;
            drawW = maxSize;
          }
        } else {
          if (drawH > maxSize) {
            drawW = (drawW * maxSize) / drawH;
            drawH = maxSize;
          }
        }
        const radius = Math.max(drawW, drawH) / 2;

        creatures.push(new Creature({
          type: 'image',
          x: width / 2 + (Math.random() - 0.5) * 140,
          y: height / 3,
          radius: radius,
          drawW: drawW,
          drawH: drawH,
          image: img
        }));
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });

  // 同じ画像を再度選べるようにリセット
  imageFileInput.value = '';
});

// ゴミ箱との重なり判定
function isOverTrashBin(x, y) {
  const rect = trashBin.getBoundingClientRect();
  const binCenterX = rect.left + rect.width / 2;
  const binCenterY = rect.top + rect.height / 2;
  return Math.hypot(x - binCenterX, y - binCenterY) < 65;
}

// MediaPipe Hands の結果処理
function onResults(results) {
  if (loadingEl.style.display !== 'none') {
    loadingEl.style.display = 'none';
  }

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const lm = results.multiHandLandmarks[0];
    const gesture = detectGesture(lm);

    // 鏡像反転座標に変換
    const indexTip = {
      x: (1 - lm[8].x) * width,
      y: lm[8].y * height
    };
    const thumbTip = {
      x: (1 - lm[4].x) * width,
      y: lm[4].y * height
    };
    const pinchCenter = {
      x: (indexTip.x + thumbTip.x) / 2,
      y: (indexTip.y + thumbTip.y) / 2
    };

    latestHandData = { lm, gesture, indexTip, thumbTip, pinchCenter };
  } else {
    latestHandData = null;
  }
}

// 描画状態をリセットするヘルパー
function stopPointing() {
  if (currentStroke && currentStroke.length > 0) {
    allStrokes.push(currentStroke);
    currentStroke = null;
  }
  isDrawingActive = false;
  pointHoldStartTime = null;
  pointAnchorPos = null;
}

// メイン描画＆物理演算ループ
function renderLoop() {
  const now = performance.now();

  // 1. カメラ映像を鏡像反転して背景に描画
  ctx.save();
  ctx.translate(width, 0);
  ctx.scale(-1, 1);
  if (video.readyState >= 2) {
    const vRatio = video.videoWidth / video.videoHeight;
    const cRatio = width / height;
    let drawW, drawH, offsetX, offsetY;
    if (cRatio > vRatio) {
      drawW = width;
      drawH = width / vRatio;
      offsetX = 0;
      offsetY = (height - drawH) / 2;
    } else {
      drawH = height;
      drawW = height * vRatio;
      offsetX = (width - drawW) / 2;
      offsetY = 0;
    }
    ctx.drawImage(video, offsetX, offsetY, drawW, drawH);
  }
  ctx.restore();

  // 2. 手のジェスチャーに応じた処理
  if (latestHandData) {
    const { gesture, indexTip, pinchCenter } = latestHandData;

    if (gesture === 'POINT') {
      releaseGrab();

      if (!isDrawingActive) {
        // まだ描画開始前：1秒間指先が静止しているかチェック
        if (!pointHoldStartTime || dist(indexTip, pointAnchorPos) > STILL_THRESHOLD_PX) {
          // 動いたらタイマーと基準位置をリセット
          pointHoldStartTime = now;
          pointAnchorPos = { ...indexTip };
        }

        const elapsed = now - pointHoldStartTime;
        const progress = Math.min(elapsed / HOLD_DURATION_MS, 1);
        statusEl.textContent = `☝️ そのまま1秒静止で描画開始... (${Math.floor(progress * 100)}%)`;

        // チャージ中のプログレスリング表示
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(indexTip.x, indexTip.y, 22, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = '#ffd166';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(indexTip.x, indexTip.y, 22, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
        ctx.stroke();
        ctx.restore();

        if (elapsed >= HOLD_DURATION_MS) {
          isDrawingActive = true;
          currentStroke = [{ x: indexTip.x, y: indexTip.y }];
        }
      } else {
        // 1秒静止を達成し描画モード中（指を立てている間はずっと描ける）
        statusEl.textContent = '✏️ お絵かき中！';

        if (!currentStroke) {
          currentStroke = [];
        }
        const lastPt = currentStroke[currentStroke.length - 1];
        if (!lastPt || dist(lastPt, indexTip) > 4) {
          currentStroke.push({ x: indexTip.x, y: indexTip.y });
        }

        // 指先の光るポインター
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#00f2fe';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(indexTip.x, indexTip.y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

    } else {
      // 人差し指を立てるのをやめたらリセット
      stopPointing();

      if (gesture === 'OPEN') {
        statusEl.textContent = '✋ パー！生き物に変身！';
        releaseGrab();
        convertDrawingToCreature();

      } else if (gesture === 'PINCH') {
        statusEl.textContent = '🤏 掴み中！（ゴミ箱で削除）';
        if (!grabbedCreature) {
          for (let i = creatures.length - 1; i >= 0; i--) {
            if (creatures[i].contains(pinchCenter.x, pinchCenter.y)) {
              grabbedCreature = creatures[i];
              grabbedCreature.isGrabbed = true;
              grabOffset.x = grabbedCreature.x - pinchCenter.x;
              grabOffset.y = grabbedCreature.y - pinchCenter.y;
              lastPinchPos = { ...pinchCenter };
              break;
            }
          }
        }

        if (grabbedCreature) {
          grabbedCreature.x = pinchCenter.x + grabOffset.x;
          grabbedCreature.y = pinchCenter.y + grabOffset.y;
          grabbedCreature.vx = (pinchCenter.x - lastPinchPos.x) * 0.8;
          grabbedCreature.vy = (pinchCenter.y - lastPinchPos.y) * 0.8;
          lastPinchPos = { ...pinchCenter };

          // ゴミ箱の上に移動したら即座に削除
          if (isOverTrashBin(grabbedCreature.x, grabbedCreature.y) || isOverTrashBin(pinchCenter.x, pinchCenter.y)) {
            trashBin.classList.add('active');
            creatures = creatures.filter(c => c !== grabbedCreature);
            grabbedCreature = null;
            setTimeout(() => trashBin.classList.remove('active'), 300);
          } else {
            trashBin.classList.remove('active');
          }
        } else {
          trashBin.classList.remove('active');
        }

        // ピンチ位置にリング表示
        ctx.strokeStyle = '#ffd166';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(pinchCenter.x, pinchCenter.y, 18, 0, Math.PI * 2);
        ctx.stroke();

      } else {
        statusEl.textContent = '🖐️ 手を認識中';
        releaseGrab();
      }
    }
  } else {
    statusEl.textContent = '手をかざしてください';
    stopPointing();
    releaseGrab();
  }

  // 3. まだ生き物になっていない白い描画線を描画
  ctx.save();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
  ctx.shadowBlur = 10;

  const strokesToDraw = currentStroke ? [...allStrokes, currentStroke] : allStrokes;
  for (const stroke of strokesToDraw) {
    if (stroke.length < 2) continue;
    ctx.beginPath();
    ctx.moveTo(stroke[0].x, stroke[0].y);
    for (let i = 1; i < stroke.length; i++) {
      ctx.lineTo(stroke[i].x, stroke[i].y);
    }
    ctx.stroke();
  }
  ctx.restore();

  // 4. すべての生き物を更新＆描画
  for (const creature of creatures) {
    creature.update(now);
    creature.draw(ctx);
  }

  requestAnimationFrame(renderLoop);
}

function releaseGrab() {
  if (grabbedCreature) {
    grabbedCreature.isGrabbed = false;
    grabbedCreature = null;
  }
  trashBin.classList.remove('active');
}

// MediaPipe Hands セットアップ
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

hands.onResults(onResults);

// カメラ起動
const camera = new Camera(video, {
  onFrame: async () => {
    await hands.send({ image: video });
  },
  width: 1280,
  height: 720
});

camera.start();
requestAnimationFrame(renderLoop);
</script>
</body>
</html>
